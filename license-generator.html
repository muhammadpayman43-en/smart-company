<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>License Generator</title><style>
:root{font-family:Segoe UI,Tahoma,sans-serif;color:#172033;background:#eef2f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#fff;border:1px solid #dce3ed;border-radius:20px;box-shadow:0 18px 55px #17203318;padding:28px}h1{margin:0;color:#142b4d;font-size:26px}p{color:#677489;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 180px;gap:14px}label{display:grid;gap:7px;color:#42516a;font-size:13px;font-weight:650}.wide{grid-column:1/-1}input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fbfdff;color:#172033;outline:0}input:focus,textarea:focus{border-color:#176b87;box-shadow:0 0 0 3px #176b8718}textarea{min-height:130px;resize:vertical;direction:ltr}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}button{border:0;border-radius:10px;padding:11px 17px;cursor:pointer;font-weight:700;background:#e8eef5;color:#18314f}button.primary{background:#173f68;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.status{min-height:24px;color:#087b68;font-size:13px}@media(max-width:520px){body{padding:12px}.card{padding:20px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.actions button{flex:1}}
</style></head><body><main class="card"><h1>سازنده لایسنس</h1><p>این فایل خصوصی مدیر است. آن را همراه برنامه یا برای مشتری ارسال نکنید.</p><div class="grid"><label class="wide">Device ID<input id="device" dir="ltr" autocomplete="off" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX"></label><label>مدت (روز)<input id="days" type="number" min="1" max="3650" value="365"></label><label>نام مشتری (اختیاری)<input id="customer" maxlength="120"></label></div><div class="actions"><button class="primary" id="generate">ساخت لایسنس</button><button id="copy" disabled>کپی لایسنس</button><button id="download" disabled>دانلود لایسنس</button></div><p class="status" id="status"></p><label>License<textarea id="output" readonly></textarea></label></main><script>
const PRIVATE_KEY="MC4CAQAwBQYDK2VwBCIEIPIpmiOePqTQ9CpSAgsRUNutUIIQmpMix4z+xBDngXZC";
const $=id=>document.getElementById(id),enc=new TextEncoder();let result="";
const bytes=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const b64url=data=>btoa(String.fromCharCode(...new Uint8Array(data))).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'');
$('generate').onclick=async()=>{try{const deviceId=$('device').value.trim().toUpperCase(),days=Number($('days').value);if(!deviceId||!Number.isInteger(days)||days<1)throw Error('Device ID و مدت معتبر وارد کنید.');const now=new Date(),expiry=new Date(now.getTime()+days*86400000);const payload={deviceId,issueDate:now.toISOString(),expiryDate:expiry.toISOString(),licenseId:crypto.randomUUID(),customerName:$('customer').value.trim(),exp:Math.floor(expiry.getTime()/1000)};const body=enc.encode(JSON.stringify(payload));const key=await crypto.subtle.importKey('pkcs8',bytes(PRIVATE_KEY),{name:'Ed25519'},false,['sign']);const signature=await crypto.subtle.sign('Ed25519',key,body);result=`${b64url(body)}.${b64url(signature)}`;$('output').value=result;$('copy').disabled=$('download').disabled=false;$('status').textContent=`ساخته شد — انقضا: ${payload.expiryDate}`;}catch(error){$('status').textContent=error.message||'مرورگر از Ed25519 پشتیبانی نمی‌کند. از نسخه جدید Edge یا Chrome استفاده کنید.'}};
$('copy').onclick=async()=>{await navigator.clipboard.writeText(result);$('status').textContent='لایسنس کپی شد.'};
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([result],{type:'text/plain'}));a.download=`license-${$('device').value.trim()}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
